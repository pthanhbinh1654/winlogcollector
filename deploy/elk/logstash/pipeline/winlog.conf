input {
  file {
    path => ["/input/**/*.jsonl", "/input/**/*.jsonl.ready", "/input/**/*.ready"]
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_winlog"
    discover_interval => 5
  }
}

filter {
  # 1. Map TimeCreatedUtc -> @timestamp
  date {
    match => ["TimeCreatedUtc", "ISO8601"]
    target => "@timestamp"
    timezone => "UTC"
  }

  # 2. Flatten EventData fields lên top-level
  if [EventData] {
    ruby {
      code => '
        event_data = event.get("EventData")
        if event_data.is_a?(Hash)
          event_data.each do |k, v|
            event.set("ed_#{k}", v)
          end
        end
      '
    }
  }

  # 3. Label theo EventId (Security events thường gặp)
  if [Channel] == "Security" {
    if [EventId] == 4624 { mutate { add_field => { "event_label" => "Logon Success" } } }
    if [EventId] == 4625 { mutate { add_field => { "event_label" => "Logon Failure" } } }
    if [EventId] == 4688 { mutate { add_field => { "event_label" => "Process Created" } } }
    if [EventId] == 4648 { mutate { add_field => { "event_label" => "Explicit Logon" } } }
    if [EventId] == 4672 { mutate { add_field => { "event_label" => "Special Privileges Assigned" } } }
    if [EventId] == 4720 { mutate { add_field => { "event_label" => "User Account Created" } } }
    if [EventId] == 4726 { mutate { add_field => { "event_label" => "User Account Deleted" } } }
  }

  if [Channel] =~ /PowerShell/ {
    if [EventId] == 4103 { mutate { add_field => { "event_label" => "PS Module Logging" } } }
    if [EventId] == 4104 { mutate { add_field => { "event_label" => "PS Script Block" } } }
  }

  # 4. Bỏ RawXml khỏi Elasticsearch để tiết kiệm dung lượng
  mutate {
    remove_field => ["RawXml", "message"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "winlogs-%{+YYYY.MM.dd}"
    document_id => "%{RecordId}-%{Channel}"
  }
}
